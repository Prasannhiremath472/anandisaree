<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/anandi-mark.png" />
    <meta name="theme-color" content="#54208C" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anandi Sarees | Authentic Maharashtrian &amp; Premium Indian Sarees</title>
    <meta
      name="description"
      content="Shop authentic Paithani, Nauvari and premium Maharashtrian handloom sarees from Anandi Sarees, along with curated Indian silk collections."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: radial-gradient(circle at 30% 20%, #8746c4 0%, #54208c 45%, #2d124c 100%);
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #initial-loader.loader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #initial-loader .loader-mark {
        position: relative;
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #initial-loader .loader-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid rgba(247, 186, 103, 0.25);
        border-top-color: #f7ba67;
        animation: loader-spin 1.1s linear infinite;
      }
      #initial-loader .loader-logo {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        object-fit: cover;
        background: #fff;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        animation: loader-pulse 1.8s ease-in-out infinite;
      }
      #initial-loader .loader-brand {
        font-family: "Playfair Display", serif;
        font-size: 22px;
        letter-spacing: 0.06em;
        color: #fff;
        text-align: center;
      }
      #initial-loader .loader-tagline {
        margin-top: 4px;
        font-family: "Poppins", sans-serif;
        font-size: 11px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #f7ba67;
        text-align: center;
      }
      #initial-loader .loader-dots {
        display: flex;
        gap: 6px;
      }
      #initial-loader .loader-dots span {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #f7ba67;
        animation: loader-dot 1.2s ease-in-out infinite;
      }
      #initial-loader .loader-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      #initial-loader .loader-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes loader-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
      }
      @keyframes loader-dot {
        0%,
        80%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        40% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }
    </style>
  </head>
  <body>
    <div id="initial-loader">
      <div class="loader-mark">
        <span class="loader-ring"></span>
        <img class="loader-logo" src="/images/anandi-mark.png" alt="Anandi Sarees" />
      </div>
      <div>
        <p class="loader-brand">Anandi Sarees</p>
        <p class="loader-tagline">Authentic Handloom Elegance</p>
      </div>
      <div class="loader-dots">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
    <div id="root"></div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
